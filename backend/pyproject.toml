[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "workledger-backend"
version = "0.1.0"
description = "WorkLedger API service"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "pydantic-settings>=2.4",
  "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
dev = [
  "httpx2>=2.0",
  "pytest>=8.0",
  "ruff>=0.6",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
